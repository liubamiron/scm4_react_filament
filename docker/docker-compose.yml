services:
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ../server:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

  app:
    build:
      context: ../server
      dockerfile: Dockerfile.fpm
    container_name: laravel_app
    volumes:
      - ../server:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - mysql
    networks:
      - laravel_network

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network

  client:
    build:
      context: ../client
      dockerfile: Dockerfile.dev
    container_name: react_client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api.localhost/api
      VITE_STORAGE_URL: http://localhost/storage
    volumes:
      - ../client:/app
      - /app/node_modules
    networks:
      - laravel_network
    depends_on:
      - app

volumes:
  mysql_data:

networks:
  laravel_network:
    driver: bridge