# Директивы nginx для субдомена new.scm4.md на Plesk (host.md).
#
# Куда вставлять:
#   Websites & Domains → new.scm4.md → Apache & nginx Settings
#   → поле "Additional nginx directives" → вставить всё, что ниже → Apply
#
# Зачем этот файл существует:
#   PHP запускается в режиме "FPM application served by nginx", то есть Apache
#   в обработке запросов не участвует и .htaccess не читается вовсе. Правила
#   маршрутизации приходится задавать здесь. Держим их в репозитории, чтобы их
#   можно было восстановить при переезде на основной домен и видеть в истории
#   изменений — сама панель Plesk ничего не версионирует.
#
# Что настраивается:
#   Document root субдомена смотрит в httpdocs/server/public, где рядом лежат
#   index.html собранного React и index.php Laravel. Ниже разводится, кому
#   какой запрос достаётся.
#
# Порядок блоков в файле роли не играет: nginx выбирает location по своим
# правилам приоритета (^~ важнее регулярных выражений, регулярные важнее
# обычного префикса), а не по порядку следования.

# Пути бэкенда уходят в Laravel, даже когда файла с таким именем нет.
# /livewire нужен админке Filament — без него она не работает.
location ~ ^/(api|admin|livewire|up)(/|$) {
    try_files $uri /index.php$is_args$args;
}

# Загруженные через админку файлы отдаются с диска по симлинку public/storage.
# Если файла нет — честный 404. Без этого блока отсутствующая картинка
# вернула бы HTML главной страницы с кодом 200.
location ^~ /storage/ {
    try_files $uri =404;
}

# Всё остальное: существующий файл (бандл React, ассеты Filament, картинки)
# отдаётся как есть, а любой неизвестный путь вида /ro/events/foo передаётся
# в SPA, чтобы маршрут разобрал уже TanStack Router в браузере.
location / {
    try_files $uri $uri/ /index.html;
}
